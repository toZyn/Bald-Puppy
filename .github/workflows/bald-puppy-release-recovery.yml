name: Bald Puppy release recovery

on:
  push:
    branches: [main]
    paths: [.github/workflows/bald-puppy-release-recovery.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing Bald Puppy release workflow run ID to recover
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bald-puppy-recovery-${{ inputs.run_id || '43619412562' }}
  cancel-in-progress: false

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: "2"
  # Keep linking within the memory/disk budget of standard public runners.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      matrix: ${{ steps.release.outputs.matrix }}
      targets: ${{ steps.release.outputs.targets }}
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
      source_run: ${{ steps.release.outputs.source_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.run_id || '43619412562' }}
    steps:
      - name: Check recovery workflow and release documentation formatting
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, subprocess, sys
          paths = [".github/workflows/bald-puppy-release-recovery.yml", ".github/workflows/bald-puppy-release.yml", "docs/releases.md"]
          changed = False
          for path in paths:
              encoded = subprocess.check_output(["gh", "api", f"repos/{os.environ['GH_REPO']}/contents/{path}?ref={os.environ['GITHUB_SHA']}", "--jq", ".content"], text=True)
              source = base64.b64decode(encoded).decode()
              result = subprocess.run(["npx", "--yes", "prettier@3.5.3", "--stdin-filepath", path, "--print-width", "80", "--tab-width", "2", "--prose-wrap", "preserve", "--quote-props", "consistent", "--trailing-comma", "all"], input=source, text=True, capture_output=True, check=True)
              if result.stdout != source:
                  changed = True
                  print("BEGIN_FORMATTED_FILE " + path)
                  print(result.stdout, end="")
                  print("END_FORMATTED_FILE " + path)
          sys.exit(1 if changed else 0)
          PY
      - name: Wait for the source run and validate its provenance
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          for attempt in $(seq 1 60); do
            gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
            status="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/source-run.json"))["status"])')"
            if [[ "$status" == completed ]]; then break; fi
            sleep 10
          done
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/source-artifacts.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((root/"source-run.json").read_text())
          assert run["status"] == "completed", "Source run is still active"
          assert run["repository"]["full_name"].lower() == os.environ["GH_REPO"].lower()
          assert run["path"].split("@")[0] == ".github/workflows/bald-puppy-release.yml"
          assert re.fullmatch(r"[0-9a-f]{40}", run["head_sha"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("commit=" + run["head_sha"] + "\n")
          PY
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: release-metadata
      - name: Validate release metadata and select missing targets
        id: release
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "scripts/release")
          import release
          meta = json.loads(Path("release-metadata/release.json").read_text())
          assert meta["commit"] == os.environ["SOURCE_COMMIT"]
          version = release.version_value(meta["version"])
          assert Path("VERSION").read_text().strip() == version
          assert meta["tag"] == "v" + version
          runners = {
              "x86_64-unknown-linux-gnu": "ubuntu-24.04",
              "aarch64-unknown-linux-gnu": "ubuntu-24.04-arm",
              "x86_64-unknown-linux-musl": "ubuntu-24.04",
              "aarch64-unknown-linux-musl": "ubuntu-24.04-arm",
              "x86_64-apple-darwin": "macos-15-intel",
              "aarch64-apple-darwin": "macos-15",
              "x86_64-pc-windows-msvc": "windows-2025",
              "aarch64-pc-windows-msvc": "windows-11-arm",
          }
          assert set(release.TARGETS) == set(runners), "Update the recovery target mapping"
          artifacts = json.loads((Path(os.environ["RUNNER_TEMP"])/"source-artifacts.json").read_text())
          names = {a["name"] for a in artifacts["artifacts"] if not a["expired"]}
          assert "release-metadata" in names, "Source metadata expired or missing"
          missing = [{"target": t, "runner": r} for t, r in runners.items() if "binaries-" + t not in names]
          view = subprocess.run(["gh", "release", "view", meta["tag"], "--json", "isDraft"], capture_output=True, text=True)
          published = view.returncode == 0 and not json.loads(view.stdout)["isDraft"]
          values = {
              "version": version, "tag": meta["tag"], "prerelease": str(meta["prerelease"]).lower(),
              "matrix": json.dumps({"include": missing or [{"target": "x86_64-unknown-linux-gnu", "runner": "ubuntu-24.04"}]}),
              "targets": json.dumps([m["target"] for m in missing]),
              "build": str(bool(missing) and not published).lower(),
              "publish": str(not published).lower(),
              "source_run": os.environ["SOURCE_RUN"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in values.items():
                  out.write(key + "=" + value + "\n")
          print("Recovery targets:", [m["target"] for m in missing])
          print("Release already published:", published)
          PY

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' }}
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: ${{ matrix.runner == 'macos-15' && '1' || '2' }}
      TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      STABLE_GIT_COMMIT: ${{ needs.prepare.outputs.commit }}
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcap-dev cmake clang perl nasm
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Use short paths for Windows Cargo dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
          $cargoCache = "$env:SystemDrive\bp-cargo"
          New-Item -ItemType Directory -Path $cargoCache -Force | Out-Null
          "CARGO_HOME=$cargoCache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - name: Install Zig for musl C++ dependencies
        if: contains(matrix.target, '-musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Set up verified musl toolchain dependencies
        if: contains(matrix.target, '-musl')
        env:
          CODEX_MUSL_RELEASE_LINK_FLAGS: "1"
        run: bash .github/scripts/install-musl-build-tools.sh
      - name: Set up verified V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Compile, assemble full package, and smoke-test
        run: python scripts/release/release.py build --target "$TARGET" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      SOURCE_RUN: ${{ needs.prepare.outputs.source_run }}
      RECOVERED_TARGETS: ${{ needs.prepare.outputs.targets }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Download successful original builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist
      - name: Download recovered builds
        if: needs.prepare.outputs.build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          path: release-metadata
      - name: Record recovery build provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("release-metadata/release.json")
          meta = json.loads(path.read_text())
          meta["recovery"] = {
              "sourceRun": int(os.environ["SOURCE_RUN"]),
              "recoveryRun": int(os.environ["GITHUB_RUN_ID"]),
              "recoveredTargets": json.loads(os.environ["RECOVERED_TARGETS"]),
              "profile": {"optimization": 2, "codegenUnits": 16, "lto": False, "debug": 0},
          }
          path.write_text(json.dumps(meta, indent=2) + "\n")
          PY
      - name: Require every platform, verify archive contents, and create checksums
        run: python3 scripts/release/release.py collect --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
      - name: Upload to draft, then publish complete release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/release.py verify-tag --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          # An interrupted draft is resumable; published assets are never overwritten.
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Release is already published; use a new version"'
          else
            args=(--target "$RELEASE_COMMIT" --draft --title "Bald Puppy $RELEASE_VERSION" --notes-file release-metadata/notes.md)
            if [[ "$IS_PRERELEASE" == true ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release edit "$RELEASE_TAG" --title "Bald Puppy $RELEASE_VERSION" --notes-file release-metadata/notes.md
          gh release upload "$RELEASE_TAG" dist/* --clobber
          # Confirm GitHub received the complete asset set before making it public.
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          python3 scripts/release/release.py verify-upload --assets release-assets.json
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$IS_PRERELEASE"
