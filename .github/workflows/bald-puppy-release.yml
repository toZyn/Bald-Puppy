name: Bald Puppy release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION, .github/workflows/bald-puppy-release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag; leave empty to release the selected branch VERSION"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bald-puppy-release
  # A newer requested main release supersedes an incomplete older build.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: "1"
  # Keep linking within the memory/disk budget of standard public runners.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version, changelog, and release tests
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          if [[ -z "$RELEASE_TAG" ]]; then RELEASE_TAG="v$(cat VERSION)"; fi
          python3 scripts/release/release.py prepare --tag "$RELEASE_TAG" --allow-untagged
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      STABLE_GIT_COMMIT: ${{ needs.prepare.outputs.commit }}
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcap-dev cmake clang perl nasm
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Use short paths for Windows Cargo dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
          $cargoCache = "$env:SystemDrive\bp-cargo"
          New-Item -ItemType Directory -Path $cargoCache -Force | Out-Null
          "CARGO_HOME=$cargoCache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - name: Install Zig for musl C++ dependencies
        if: contains(matrix.target, '-musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Set up verified musl toolchain dependencies
        if: contains(matrix.target, '-musl')
        env:
          CODEX_MUSL_RELEASE_LINK_FLAGS: "1"
        run: bash .github/scripts/install-musl-build-tools.sh
      - name: Set up verified V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Compile, assemble full package, and smoke-test
        run: python scripts/release/release.py build --target "$TARGET" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata
      - name: Require every platform, verify archive contents, and create checksums
        run: python3 scripts/release/release.py collect --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
      - name: Upload to draft, then publish complete release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/release.py verify-tag --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          # An interrupted draft is resumable; published assets are never overwritten.
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Release is already published; use a new version"'
          else
            args=(--target "$RELEASE_COMMIT" --draft --title "Bald Puppy $RELEASE_VERSION" --notes-file release-metadata/notes.md)
            if [[ "$IS_PRERELEASE" == true ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release edit "$RELEASE_TAG" --title "Bald Puppy $RELEASE_VERSION" --notes-file release-metadata/notes.md
          gh release upload "$RELEASE_TAG" dist/* --clobber
          # Confirm GitHub received the complete asset set before making it public.
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          python3 scripts/release/release.py verify-upload --assets release-assets.json
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$IS_PRERELEASE"
