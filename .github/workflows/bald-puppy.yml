name: Bald Puppy
on:
  push:
    branches: [main, qwen-replacement]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bald-puppy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migrate:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/qwen-replacement' && startsWith(github.event.head_commit.message, 'chore: bootstrap Qwen replacement')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import pinned Qwen source and interface changes
        run: |
          cp .github/workflows/bald-puppy.yml /tmp/bald-puppy.yml
          python3 - <<'PYCODE'
          import base64, gzip, hashlib
          patch = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == '4c2c49cfa923e70ce76b24d8bb679097b2a649c292f97cc16e15fc708bd53710'
          open('/tmp/bald-puppy.patch', 'wb').write(patch)
          PYCODE
          git fetch --depth=1 https://github.com/QwenLM/qwen-code.git 038b60e3099a174395f26ed0d1b501eb04d2302d
          git read-tree --reset -u FETCH_HEAD
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/bald-puppy.yml .github/workflows/bald-puppy.yml
          git apply /tmp/bald-puppy.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: corepack pnpm install --frozen-lockfile
      - name: Build CLI and dependencies
        run: |
          corepack pnpm config set workspace-concurrency 1 --location project
          npm run build -- --cli-only
          git restore .npmrc pnpm-workspace.yaml
      - name: Typecheck CLI
        run: npm run typecheck --workspace packages/cli
      - name: Test terminal interface
        working-directory: packages/cli
        run: npx vitest run src/ui/components/Header.test.tsx src/ui/opentui/opentui-header.test.tsx src/ui/themes/theme.test.ts src/ui/themes/theme-manager.test.ts src/ui/utils/customBanner.test.ts src/ui/components/Footer.test.tsx src/ui/components/InputPrompt.test.tsx --maxWorkers=1
      - name: Bundle and smoke test
        run: |
          npm run bundle
          node scripts/cli-entry.js --version
          node scripts/cli-entry.js --help
          npm run prepare:package
          node -e "const p=require('./dist/package.json');if(!p.bin['bald-puppy'])throw Error('Missing executable')"
          npm pack ./dist --pack-destination .
      - uses: actions/upload-artifact@v4
        with:
          name: bald-puppy-package
          path: '*.tgz'
      - name: Save validated replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: replace Codex with Qwen Code and Zyn-inspired interface'
          git push origin HEAD:qwen-replacement
  verify:
    if: >-
      github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bootstrap Qwen replacement')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: corepack pnpm install --frozen-lockfile
      - name: Build CLI and dependencies
        run: |
          corepack pnpm config set workspace-concurrency 1 --location project
          npm run build -- --cli-only
          git restore .npmrc pnpm-workspace.yaml
      - name: Typecheck CLI
        run: npm run typecheck --workspace packages/cli
      - name: Test terminal interface
        working-directory: packages/cli
        run: npx vitest run src/ui/components/Header.test.tsx src/ui/opentui/opentui-header.test.tsx src/ui/themes/theme.test.ts src/ui/themes/theme-manager.test.ts src/ui/utils/customBanner.test.ts src/ui/components/Footer.test.tsx src/ui/components/InputPrompt.test.tsx --maxWorkers=1
      - name: Bundle and smoke test
        run: |
          npm run bundle
          node scripts/cli-entry.js --version
          node scripts/cli-entry.js --help
          npm run prepare:package
          node -e "const p=require('./dist/package.json');if(!p.bin['bald-puppy'])throw Error('Missing executable')"
          npm pack ./dist --pack-destination .
      - uses: actions/upload-artifact@v4
        with:
          name: bald-puppy-package
          path: '*.tgz'
