name: Bald Puppy
on:
  push:
    branches:
      - main
      - qwen-replacement
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: bald-puppy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        env:
          QWEN_SKIP_PREPARE: "1"
        run: corepack pnpm install --frozen-lockfile
      - name: Check dependency lockfile
        run: npm run check:lockfile
      - name: Lint interface changes
        run: node node_modules/eslint/bin/eslint.js packages/cli/src/ui/components/Header.tsx packages/cli/src/ui/components/Header.test.tsx packages/cli/src/ui/opentui/opentui-header.tsx packages/cli/src/ui/opentui/opentui-header.test.tsx packages/cli/src/ui/themes/qwen-dark.ts packages/cli/src/ui/themes/theme.test.ts scripts/prepare-package.js
      - name: Build CLI and dependencies
        run: |
          corepack pnpm config set workspace-concurrency 1 --location project
          npm run build -- --cli-only
          git restore .npmrc pnpm-workspace.yaml
      - name: Typecheck CLI
        run: npm run typecheck --workspace packages/cli
      - name: Test terminal interface
        working-directory: packages/cli
        run: npx vitest run src/ui/components/Header.test.tsx src/ui/opentui/opentui-header.test.tsx src/ui/themes/theme.test.ts src/ui/themes/theme-manager.test.ts src/ui/utils/customBanner.test.ts src/ui/components/Footer.test.tsx src/ui/components/InputPrompt.test.tsx --maxWorkers=1
      - name: Bundle and smoke test
        run: |
          npm run bundle
          node scripts/cli-entry.js --version
          node scripts/cli-entry.js --help
          npm run prepare:package
          node -e "const p=require('./dist/package.json');if(!p.bin['bald-puppy'])throw Error('Missing executable')"
          npm pack ./dist --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: bald-puppy-package
          path: ${{ runner.temp }}/*.tgz
