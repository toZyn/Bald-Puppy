name: Stage verified TUI repair
'on':
  push:
    branches:
    - fix/zyn-tui-fidelity
    paths:
    - .github/workflows/stage-fidelity.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_USAGE_STATISTICS_ENABLED: '0'
      OTEL_SDK_DISABLED: 'true'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Stage source patch 1
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 2
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 3
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 4
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 5
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 6
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 7
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 8
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 9
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 10
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 11
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 12
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 13
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Stage source patch 14
      run: 'cat >> /tmp/fidelity.b64 <<''BALD_PATCH''

        

        BALD_PATCH'
    - name: Apply reviewed source patch
      run: 'base64 -d /tmp/fidelity.b64 | gzip -d > /tmp/fidelity.patch

        echo ''4a4f092ac74114eeecabac2a9a33f656d2cec34d8bae9eb2ae4ac525023a5a75  /tmp/fidelity.patch'' | sha256sum -c -

        git apply --check /tmp/fidelity.patch

        git apply /tmp/fidelity.patch'
    - run: corepack enable
    - name: Install dependencies
      env:
        QWEN_SKIP_PREPARE: '1'
      run: corepack pnpm install --frozen-lockfile
    - name: Check dependency lockfile
      run: npm run check:lockfile
    - name: Lint interface changes
      run: node node_modules/eslint/bin/eslint.js integration-tests/interactive/interactive-session-viewport.test.ts integration-tests/interactive/interactive-session.test.ts integration-tests/interactive/interactive-session.ts packages/cli/src/i18n/locales/ca.js packages/cli/src/i18n/locales/de.js packages/cli/src/i18n/locales/en.js packages/cli/src/i18n/locales/fr.js packages/cli/src/i18n/locales/ja.js packages/cli/src/i18n/locales/pt.js packages/cli/src/i18n/locales/ru.js packages/cli/src/i18n/locales/zh-TW.js packages/cli/src/i18n/locales/zh.js packages/cli/src/ui/AppContainer.test.tsx packages/cli/src/ui/AppContainer.tsx packages/cli/src/ui/components/AppHeader.test.tsx packages/cli/src/ui/components/AppHeader.tsx packages/cli/src/ui/components/BaseTextInput.test.tsx packages/cli/src/ui/components/BaseTextInput.tsx packages/cli/src/ui/components/Composer.test.tsx packages/cli/src/ui/components/Composer.tsx packages/cli/src/ui/components/Footer.test.tsx packages/cli/src/ui/components/Footer.tsx packages/cli/src/ui/components/Header.test.tsx packages/cli/src/ui/components/Header.tsx packages/cli/src/ui/components/HistoryItemDisplay.test.tsx packages/cli/src/ui/components/InputPrompt.tsx packages/cli/src/ui/components/LoadingIndicator.test.tsx packages/cli/src/ui/components/LoadingIndicator.tsx packages/cli/src/ui/components/SuggestionsDisplay.test.tsx packages/cli/src/ui/components/SuggestionsDisplay.tsx packages/cli/src/ui/components/messages/ConversationMessages.test.tsx packages/cli/src/ui/components/messages/ConversationMessages.tsx packages/cli/src/ui/components/messages/StatusMessages.test.tsx packages/cli/src/ui/components/messages/StatusMessages.tsx packages/cli/src/ui/components/messages/ToolMessage.test.tsx packages/cli/src/ui/components/shared/BaseSelectionList.test.tsx packages/cli/src/ui/components/shared/BaseSelectionList.tsx packages/cli/src/ui/components/shared/DescriptiveRadioButtonSelect.test.tsx packages/cli/src/ui/components/shared/ToolStatusIndicator.tsx packages/cli/src/ui/themes/qwen-dark.ts packages/cli/src/ui/themes/semantic-tokens.ts packages/cli/src/ui/utils/layoutUtils.test.ts packages/cli/src/ui/utils/layoutUtils.ts packages/cli/src/ui/utils/terminal-resize-reflow.test.ts packages/cli/src/ui/utils/terminal-resize-reflow.ts scripts/tests/interactive-session-start.test.ts integration-tests/interactive/fixtures/tui-local-only-network.cjs integration-tests/interactive/fixtures/tui-network-guard-proof.mjs integration-tests/interactive/fixtures/tui-static-geometry.tsx integration-tests/interactive/tui-header-repaint.test.ts packages/cli/src/ui/components/shared/ToolStatusIndicator.test.tsx packages/cli/src/ui/terminal-brand.ts
    - name: Build CLI and dependencies
      run: 'corepack pnpm config set workspace-concurrency 1 --location project

        npm run build -- --cli-only

        git restore .npmrc pnpm-workspace.yaml

        '
    - name: Typecheck CLI
      run: npm run typecheck --workspace packages/cli
    - name: Test terminal interface
      env:
        NODE_OPTIONS: --max-old-space-size=6144 --require=${{ github.workspace }}/integration-tests/interactive/fixtures/tui-local-only-network.cjs
        TUI_MOCK_PORT: '54321'
      working-directory: packages/cli
      run: npx vitest run src/ui/components/Composer.test.tsx src/ui/utils/layoutUtils.test.ts src/ui/utils/synchronizedOutput.test.ts src/ui/utils/terminalRedrawOptimizer.test.ts src/ui/utils/terminal-resize-reflow.test.ts src/ui/ink-cursor-rendering.test.tsx src/ui/components/SuggestionsDisplay.qualifiedLabels.test.tsx src/ui/components/shared/BaseSelectionList.mouse.test.tsx src/ui/components/shared/BaseSelectionList.test.tsx src/ui/components/shared/DescriptiveRadioButtonSelect.test.tsx src/ui/components/shared/ToolStatusIndicator.test.tsx src/ui/components/AppHeader.test.tsx src/ui/components/SuggestionsDisplay.mouse.test.tsx src/ui/components/LoadingIndicator.test.tsx src/ui/components/MainContent.test.tsx src/ui/components/agent-view/AgentComposer.test.tsx src/ui/components/agent-view/AgentComposer.queuedMessages.test.tsx src/ui/components/agent-view/agentComposerLayout.measurement.test.tsx src/ui/components/Header.test.tsx src/ui/components/BaseTextInput.test.tsx src/ui/components/SuggestionsDisplay.test.tsx src/ui/components/Footer.test.tsx src/ui/components/MainContent.show-more-lines.test.tsx src/ui/components/HistoryItemDisplay.test.tsx src/ui/hooks/useLoadingIndicator.test.ts src/ui/components/messages/ConversationMessages.test.tsx src/ui/components/messages/StatusMessages.test.tsx src/ui/components/messages/ToolGroupMessage.test.tsx src/ui/components/messages/ToolGroupMessage.heightBudget.test.tsx src/ui/themes/theme.test.ts src/ui/themes/theme-manager.test.ts src/ui/utils/customBanner.test.ts src/ui/layouts/DefaultAppLayout.test.tsx src/ui/layouts/ScreenReaderAppLayout.test.tsx src/ui/AppContainer.test.tsx src/ui/components/InputPrompt.test.tsx --coverage.enabled=false --maxWorkers=2 --minWorkers=1
    - name: Bundle and smoke test
      run: 'npm run bundle

        node scripts/cli-entry.js --version

        node scripts/cli-entry.js --help

        npm run prepare:package

        node -e "const p=require(''./dist/package.json'');if(!p.bin[''bald-puppy''])throw Error(''Missing executable'')"

        npm pack ./dist --pack-destination "$RUNNER_TEMP"

        '
    - name: Check interface translations
      run: node --import tsx/esm scripts/check-i18n.ts
    - name: Test terminal resize and editing in PTY
      run: npx vitest run --root integration-tests interactive/tui-header-repaint.test.ts interactive/interactive-session.test.ts interactive/interactive-session-viewport.test.ts --maxWorkers=1 --minWorkers=1 --retry=0
    - name: Test interactive startup contract
      run: npx vitest run --config scripts/tests/vitest.config.ts scripts/tests/interactive-session-start.test.ts --maxWorkers=1 --minWorkers=1
    - name: Commit verified repair
      run: 'git config user.name ''Zyn''

        git config user.email ''karatekidamericatv@gmail.com''

        git add README.md docs/design docs/images/bald-puppy-terminal-40.png docs/images/bald-puppy-terminal-80.png docs/images/bald-puppy-terminal-capture.md integration-tests/interactive scripts/tests/interactive-session-start.test.ts packages/cli/src

        git diff --cached --check

        git commit -m "fix(tui): match Zyn conversation layout and stop resize artifacts"

        git push origin HEAD:fix/zyn-tui-fidelity'
    - uses: actions/upload-artifact@v4
      with:
        name: bald-puppy-package
        path: ${{ runner.temp }}/*.tgz
